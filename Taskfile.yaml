version: '3'

vars:
  DOCKER_PHP: docker-compose exec php
  DOCKER_RUN: docker-compose run --rm php

tasks:
  docker-up:
    desc: Start docker containers
    cmds:
      - docker-compose up -d

  docker-down:
    desc: Stop docker containers
    cmds:
      - docker-compose down

  install:
    desc: Install dependencies
    cmds:
      - '{{.DOCKER_RUN}} composer install'

  phpstan:
    desc: Run PHPStan
    deps: [docker-up]
    cmds:
      - '{{.DOCKER_PHP}} php -d memory_limit=512M vendor/bin/phpstan analyse'
    aliases:
      - stan

  cs:
    desc: Check code style
    deps: [docker-up]
    cmds:
      - '{{.DOCKER_PHP}} vendor/bin/php-cs-fixer fix --dry-run --diff'

  cs-fix:
    desc: Fix code style
    deps: [docker-up]
    cmds:
      - '{{.DOCKER_PHP}} vendor/bin/php-cs-fixer fix'
    aliases:
      - fixer

  tests:
    desc: Run tests
    deps: [docker-up]
    cmds:
      - '{{.DOCKER_PHP}} vendor/bin/phpunit'

  dev:
    desc: Start development server
    cmds:
      - docker-compose up

  shell:
    desc: Start a shell in the PHP container
    deps: [docker-up]
    cmds:
      - '{{.DOCKER_PHP}} bash'

  # Same install as the test matrix in .github/workflows/ci.yml: Symfony Flex
  # restricts symfony/* packages to SYMFONY_REQUIRE. Runs in a throwaway
  # container on a copy of the repository, so vendor/ is left alone.
  test:symfony:
    desc: 'Test against one Symfony version, e.g. task test:symfony PHP=8.3 SYMFONY=7.4.*'
    vars:
      PHP: '{{.PHP | default "8.1"}}'
      SYMFONY: '{{.SYMFONY | default "5.4.*"}}'
    cmds:
      - docker build --quiet --build-arg PHP_VERSION={{.PHP}} --tag ga4-analytics-data-bundle-test:php{{.PHP}} dev/docker
      - |
        docker run --rm \
          --volume "{{.ROOT_DIR}}:/app:ro" \
          --volume ga4-analytics-data-bundle-composer:/composer-cache \
          --env COMPOSER_CACHE_DIR=/composer-cache \
          --env SYMFONY_REQUIRE='{{.SYMFONY}}' \
          ga4-analytics-data-bundle-test:php{{.PHP}} bash -c '
            set -e
            mkdir /tmp/bundle
            tar -C /app --exclude=./.git --exclude=./vendor --exclude=./composer.lock -cf - . | tar -C /tmp/bundle -xf -
            composer global config --no-plugins allow-plugins.symfony/flex true
            composer global require --quiet --no-interaction symfony/flex
            cd /tmp/bundle
            composer update --no-interaction --no-progress --prefer-dist
            vendor/bin/phpunit
          '

  test:symfony:all:
    desc: Test every PHP and Symfony pair CI tests
    cmds:
      - task: test:symfony
        vars: { PHP: '8.1', SYMFONY: '5.4.*' }
      - task: test:symfony
        vars: { PHP: '8.2', SYMFONY: '6.4.*' }
      - task: test:symfony
        vars: { PHP: '8.3', SYMFONY: '7.4.*' }
      - task: test:symfony
        vars: { PHP: '8.4', SYMFONY: '7.4.*' }
      - task: test:symfony
        vars: { PHP: '8.5', SYMFONY: '7.4.*' }

  all-tests:
    desc: Run all checks
    deps: [docker-up]
    cmds:
      - task: phpstan
      - task: cs
      - task: tests